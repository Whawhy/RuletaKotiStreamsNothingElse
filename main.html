<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: transparent;
    }
    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
    }
    /* Flecha/Indicador superior */
    .arrow {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #333;
      z-index: 2;
    }
    /* Diseño de la Ruleta */
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      /* Opciones/Sectores de color */
      background: conic-gradient(
        #ffe07e,
        #34acba,
        #72dcbb,
        #ab5675,
        #ee6a7c
      );
      /* Transición suave para el efecto de frenado */
      transition: transform 5s cubic-bezier(0.25, 0.1, 0.1, 1);
    }
  </style>
</head>
<body>

  <div class="wheel-wrapper">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <script>
    // Se ejecuta tan pronto abre/carga la página en el iframe
    window.onload = function() {
      const wheel = document.getElementById('wheel');
      // Mínimo 5 vueltas (1800 deg) + grados aleatorios
      const degrees = 1800 + Math.floor(Math.random() * 360);
      
      // Activa el giro
      setTimeout(() => {
        wheel.style.transform = `rotate(${degrees}deg)`;
      }, 100); // Breve delay para asegurar renderizado inicial
    };
  </script>

</body>
</html>
