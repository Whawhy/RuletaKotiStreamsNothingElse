<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinning Wheel</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d1d1f;
    --pill-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --text: #f5f5f7; --pill-bg: #1d1d1f; }
  }
  :root[data-theme="dark"] { --text: #f5f5f7; --pill-bg: #1d1d1f; }

  html, body { height: 100%; margin: 0; background: transparent; }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; font-family: "Helvetica Neue", Arial, sans-serif; color: var(--text);
  }
  .wrap { position: relative; width: min(86vw, 62vh, 520px); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 30px solid var(--text);
  }
  #result {
    font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 700; padding: 10px 28px;
    border-radius: 999px; background: var(--pill-bg); color: var(--text);
    border: 4px solid var(--text); min-height: 1.2em;
    visibility: hidden; opacity: 0; transition: opacity .4s;
  }
  #result.show { visibility: visible; opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <div class="pointer"></div>
  <canvas id="wheel"></canvas>
</div>
<div id="result" aria-live="polite"></div>

<script>
  /* ============ EDIT HERE ============ */

  // Pega aquí el link de tu Google Sheet publicado como CSV (termina en output=csv):
  //   https://docs.google.com/spreadsheets/d/e/XXXXXXXX/pub?output=csv
  // En la hoja, escribe las opciones en la columna A, una por fila.
  // La fila 1 es el título ("Opciones") y no cuenta como opción.
  // Para agregar, eliminar o cambiar opciones, solo edita la hoja y recarga la página
  // (Google puede tardar unos minutos en mostrar los cambios).
  // Si lo dejas vacío ("") se usa la lista de respaldo de abajo.
  const SHEET_URL = "https://drive.google.com/file/d/17vJekjn99M3Nmt5m9SyMdmpAviLg7fq9/view?usp=sharing";


  // Opciones de respaldo: se usan si el link de la hoja está vacío o no carga.
  // Add or delete options freely: each line is one slice.
  let OPTIONS = [
    "No cargo",
    "Tu excel",
    "Puto Whawhy",
    "Tacos",
    "Pasta",
    "Salad"
  ];

  // Flat colors, reused in order if there are more options than colors.
  // Use any hex color code (for example "#ff0000"). Add or delete lines to change the palette.
  const COLORS = [
    "#ffa7a5", // light pink  (1st slice)
    "#ffe07e", // yellow      (2nd slice)
    "#72dcbb", // mint green  (3rd slice)
    "#34acba", // teal blue   (4th slice)
    "#ee6a7c", // coral red   (5th slice)
    "#ab5675"  // mauve       (6th slice)
  ];

  const START_DELAY = 3;        // seconds to wait before the wheel starts spinning
  const SPIN_SECONDS = 5;       // how long the wheel takes to stop
  const SPIN_AGAIN_AFTER = 0;   // milliseconds before spinning again (0 = spin only once)

  /* =================================== */

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const resultEl = document.getElementById("result");
  const TAU = Math.PI * 2;
  let rotation = 0;

  function resize() {
    const size = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const size = canvas.clientWidth, c = size / 2, r = c - 4;
    const n = OPTIONS.length, seg = TAU / n;
    ctx.clearRect(0, 0, size, size);
    for (let i = 0; i < n; i++) {
      const a0 = rotation + i * seg, a1 = a0 + seg;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(a0 + seg / 2);
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = "700 " + Math.max(14, Math.min(28, r * 0.11, (r * 0.9 * seg) / 1.6)) + "px 'Helvetica Neue', Arial, sans-serif";
      ctx.fillText(OPTIONS[i], r - 18, 0, r * 0.7);
      ctx.restore();
    }
    // flat center hub
    ctx.beginPath();
    ctx.arc(c, c, r * 0.08, 0, TAU);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
  }

  function winnerIndex() {
    const seg = TAU / OPTIONS.length;
    const pointer = (1.5 * Math.PI - rotation) % TAU;
    return Math.floor(((pointer + TAU) % TAU) / seg) % OPTIONS.length;
  }

  function spin() {
    resultEl.classList.remove("show");
    const seg = TAU / OPTIONS.length;
    const target = Math.floor(Math.random() * OPTIONS.length);
    const within = 0.1 + Math.random() * 0.8; // stay clear of slice edges
    const start = rotation % TAU;
    let end = 1.5 * Math.PI - (target + within) * seg;
    end += TAU * (5 + Math.floor(Math.random() * 3)); // 5-7 extra turns
    while (end <= start + TAU * 4) end += TAU;

    const t0 = performance.now(), dur = SPIN_SECONDS * 1000;
    function frame(now) {
      const p = Math.min((now - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 4); // slows down smoothly
      rotation = start + (end - start) * eased;
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else {
        resultEl.textContent = OPTIONS[winnerIndex()];
        resultEl.classList.add("show");
        if (SPIN_AGAIN_AFTER > 0) setTimeout(spin, SPIN_AGAIN_AFTER);
      }
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  // Lee la primera columna de un CSV (maneja comillas), omite la fila 1 (título) y las filas vacías.
  function parseFirstColumn(csv) {
    const rows = csv.split(/\r?\n/).slice(1);
    const out = [];
    for (const row of rows) {
      let cell;
      if (row.startsWith('"')) {
        const m = row.match(/^"((?:[^"]|"")*)"/);
        cell = m ? m[1].replace(/""/g, '"') : row.slice(1);
      } else {
        cell = row.split(",")[0];
      }
      cell = cell.trim();
      if (cell) out.push(cell);
    }
    return out;
  }

  // Carga las opciones desde Google Sheets. Si hay cualquier problema, se queda con la lista de respaldo.
  async function loadOptions() {
    if (!SHEET_URL) return;
    const url = SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
    try {
      let text;
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        text = await res.text();
      } catch (e) {
        // Si el navegador bloquea la carga directa (CORS), se intenta con un servicio intermedio.
        console.warn("Carga directa falló, probando con servicio intermedio.", e);
        const res2 = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
        if (!res2.ok) throw new Error("HTTP " + res2.status);
        text = await res2.text();
      }
      const list = parseFirstColumn(text);
      if (list.length > 0) { OPTIONS = list; draw(); }
    } catch (err) {
      console.warn("No se pudo cargar la hoja, usando opciones de respaldo.", err);
    }
  }

  const optionsReady = loadOptions();
  // Starts automatically after the delay (once options are loaded), no click needed
  setTimeout(async () => { await optionsReady; spin(); }, START_DELAY * 1000);
</script>
</body>
</html>
